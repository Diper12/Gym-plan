<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="format-detection" content="telephone=no, date=no, address=no, email=no">
<meta name="theme-color" content="#0e0d0c">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="apple-mobile-web-app-title" content="GymMura">
<title>Заявки</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;700;800&family=Unbounded:wght@700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:start center;padding:18px;color:#f2ece4;font:16px/1.55 'Manrope',system-ui,sans-serif;background:radial-gradient(800px 500px at 70% 0,rgba(201,157,120,.24),transparent 62%),#0e0d0c}
.card{width:100%;max-width:560px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.11);border-radius:24px;backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);padding:24px}
h1,h2{font-family:'Unbounded','Manrope',sans-serif;font-weight:700;letter-spacing:-.01em}h1{font-size:24px;margin:0 0 8px}h2{font-size:15px;margin:22px 0 8px}
.mu{color:#a79f95}.it{border-top:1px solid rgba(255,255,255,.11);padding:12px 0;display:flex;gap:10px;justify-content:space-between;align-items:center;flex-wrap:wrap}
.it b{word-break:break-all}.it small{display:block;color:#a79f95}
.btn{font:inherit;font-weight:700;border:0;border-radius:12px;padding:9px 14px;cursor:pointer;color:#201710;background:linear-gradient(180deg,#f0d3b6,#d9b08c)}
.btn.o{background:rgba(255,255,255,.08);color:#f2ece4;border:1px solid rgba(255,255,255,.14)}
.btn:focus-visible,a:focus-visible{outline:2px solid #e9c7a6;outline-offset:2px}a{color:#e9c7a6;font-weight:700;text-decoration:none}
a[x-apple-data-detectors]{color:inherit!important;text-decoration:none!important;font:inherit!important}
</style>
</head>
<body>
<main class="card">
<h1>Заявки на доступ</h1>
<p class="mu" id="st">Подключаю облако…</p>
<h2>Ожидают решения</h2><div id="pend" class="mu">—</div>
<h2>Доступ выдан</h2><div id="appr" class="mu">—</div>
<p><a href="login.html">Вход</a> · <a href="./">Главная</a></p>
</main>
<script type="module">
const cfg={apiKey:"AIzaSyD7cP4hEgAVhNYN6Hl8Xar9Ys10UyAGKdo",authDomain:"gymmurik.firebaseapp.com",projectId:"gymmurik",storageBucket:"gymmurik.firebasestorage.app",messagingSenderId:"615882732741",appId:"1:615882732741:web:70e679c75c26742e16ecac"};
const $=i=>document.getElementById(i);
const V="https://www.gstatic.com/firebasejs/10.14.1/";
async function loadFb(){
 try{return await Promise.all([import(V+"firebase-app.js"),import(V+"firebase-auth.js"),import(V+"firebase-firestore.js")])}
 catch(e){const E="https://esm.sh/firebase@10.14.1/";return await Promise.all([import(E+"app"),import(E+"auth"),import(E+"firestore")])}
}
try{
 const [A,U,F]=await loadFb();
 const app=A.initializeApp(cfg),auth=U.getAuth(app),db=F.getFirestore(app);
 function list(box,docs,btns,empty){
  box.innerHTML='';
  if(!docs.length){box.textContent=empty;return}
  docs.forEach(d=>{
   const x=d.data(),row=document.createElement('div');row.className='it';
   const t=document.createElement('div'),b=document.createElement('b');b.textContent=d.id;
   const s=document.createElement('small');s.textContent=(x.name?x.name+' · ':'')+(x.ts?new Date(x.ts).toLocaleString('ru-RU'):'');
   t.appendChild(b);t.appendChild(s);row.appendChild(t);
   const g=document.createElement('div');g.style.display='flex';g.style.gap='6px';
   btns.forEach(([label,cls,fn])=>{const k=document.createElement('button');k.type='button';k.className='btn '+cls;k.textContent=label;k.onclick=async()=>{k.disabled=true;try{await fn(d.id)}catch(e){$('st').textContent='Ошибка: '+(e.code||e.message)}load()};g.appendChild(k)});
   row.appendChild(g);box.appendChild(row);
  });
 }
 async function load(){
  try{
   const [rq,al]=await Promise.all([F.getDocs(F.collection(db,'requests')),F.getDocs(F.collection(db,'allowed'))]);
   $('st').textContent='Вошёл как '+auth.currentUser.email+'.';
   list($('pend'),rq.docs,[['Одобрить','',async id=>{await F.setDoc(F.doc(db,'allowed',id),{ok:true,ts:Date.now()});await F.deleteDoc(F.doc(db,'requests',id))}],['Отклонить','o',id=>F.deleteDoc(F.doc(db,'requests',id))]],'Новых заявок нет.');
   list($('appr'),al.docs,[['Убрать доступ','o',id=>F.deleteDoc(F.doc(db,'allowed',id))]],'Пока никому не выдан.');
  }catch(e){$('st').textContent=e.code==='permission-denied'?'Эта страница только для владельца.':'Не удалось загрузить ('+(e.code||e.message)+').'}
 }
 U.onAuthStateChanged(auth,u=>{
  if(!u){$('st').textContent='Сначала войди на странице входа (login.html) почтой владельца.';$('pend').textContent='—';$('appr').textContent='—';return}
  load();
 });
}catch(e){$('st').textContent='Не удалось загрузить облако ('+(e&&e.message||e)+'). Отключи блокировщик рекламы или открой в Chrome.'}
</script>
</body>
</html>
