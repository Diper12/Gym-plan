<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#0e0d0c">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="apple-mobile-web-app-title" content="GymMura">
<title>Вход</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;700;800&family=Unbounded:wght@700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}[hidden]{display:none!important}
body{margin:0;min-height:100vh;display:grid;place-items:center;padding:18px;color:#f2ece4;font:16px/1.55 'Manrope',system-ui,sans-serif;background:radial-gradient(800px 500px at 70% 0,rgba(201,157,120,.24),transparent 62%),#0e0d0c}
.card{width:100%;max-width:440px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.11);border-radius:24px;backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);padding:26px}
h1{margin:0 0 8px;font-size:24px;font-family:'Unbounded','Manrope',sans-serif;font-weight:700;letter-spacing:-.01em}.mu{color:#a79f95}
.btn{font:inherit;font-weight:700;border:0;border-radius:14px;padding:13px 20px;cursor:pointer;color:#201710;background:linear-gradient(180deg,#f0d3b6,#d9b08c);width:100%;margin:14px 0 6px;font-size:17px}
.btn:disabled{opacity:.6}.btn:focus-visible,a:focus-visible{outline:2px solid #e9c7a6;outline-offset:2px}
a{color:#e9c7a6;font-weight:700;text-decoration:none}
</style>
</head>
<body>
<main class="card">
<h1>Вход</h1>
<p class="mu" id="aus">Подключаю облако…</p>
<button class="btn" id="ab" type="button" disabled>Войти через Google</button>
<p class="mu" id="chk"></p>
<button class="btn" id="rq" type="button" hidden>Запросить доступ</button>
<p><a id="go" href="./" hidden>Открыть приложение →</a></p>
</main>
<script type="module">
const cfg={apiKey:"AIzaSyD7cP4hEgAVhNYN6Hl8Xar9Ys10UyAGKdo",authDomain:"gymmurik.firebaseapp.com",projectId:"gymmurik",storageBucket:"gymmurik.firebasestorage.app",messagingSenderId:"615882732741",appId:"1:615882732741:web:70e679c75c26742e16ecac"};
const $=i=>document.getElementById(i);
const V="https://www.gstatic.com/firebasejs/10.14.1/";
async function loadFb(){
 try{return await Promise.all([import(V+"firebase-app.js"),import(V+"firebase-auth.js"),import(V+"firebase-firestore.js")])}
 catch(e){const E="https://esm.sh/firebase@10.14.1/";return await Promise.all([import(E+"app"),import(E+"auth"),import(E+"firestore")])}
}
const inApp=/Instagram|FBAN|FBAV|Telegram|Line\/|; wv\)|VKClient|YaApp|MiuiBrowser/i.test(navigator.userAgent);
const HELP=(inApp?'Ты открыл страницу во встроенном браузере приложения, а Google блокирует там вход. Открой ссылку в Safari или Chrome. ':'')+'Войди через Google, чтобы записи сохранялись в облаке и были на всех устройствах. Доступ только для одобренных почт.';
const MSG={'auth/popup-blocked':'Браузер заблокировал окно входа. Разреши всплывающие окна для этого сайта и нажми ещё раз.','auth/popup-closed-by-user':'Окно входа закрыто. Нажми ещё раз и выбери аккаунт.','auth/unauthorized-domain':'Адрес сайта не добавлен в Firebase: Authentication → Settings → Authorized domains.','auth/operation-not-allowed':'Вход через Google не включён: Authentication → Sign-in method → Google → Enable.','auth/network-request-failed':'Нет связи с интернетом.','auth/internal-error':'Внутренняя ошибка входа, попробуй ещё раз.'};
let bad=false;
try{
 const [A,U,F]=await loadFb();
 const app=A.initializeApp(cfg),auth=U.getAuth(app),db=F.getFirestore(app);
 $('ab').disabled=false;
 async function check(u){
  const mail=(u.email||'').toLowerCase(),alive=()=>auth.currentUser&&auth.currentUser.uid===u.uid;
  try{
   await F.getDocs(F.query(F.collection(db,'users',u.uid,'entries'),F.limit(1)));
   if(!alive())return;
   $('chk').textContent='Доступ к облаку есть.';$('rq').hidden=true;$('go').hidden=false;
  }catch(e){
   if(!alive())return;
   $('go').hidden=true;
   if(e.code!=='permission-denied'){$('chk').textContent='Не удалось проверить доступ ('+(e.code||e.message)+').';return}
   let sent=false;try{sent=(await F.getDoc(F.doc(db,'requests',mail))).exists()}catch(x){}
   if(!alive())return;
   $('chk').textContent=sent?'Заявка отправлена. Жди одобрения владельца и обнови страницу.':'Ты вошёл, но доступа пока нет. Нажми «Запросить доступ», чтобы владелец увидел заявку.';
   $('rq').hidden=sent;
  }
  $('rq').onclick=async()=>{
   if(!alive())return;
   try{await F.setDoc(F.doc(db,'requests',mail),{email:mail,name:u.displayName||'',ts:Date.now()});$('chk').textContent='Заявка отправлена. Жди одобрения владельца и обнови страницу.';$('rq').hidden=true}
   catch(e){$('chk').textContent=e.code==='permission-denied'?'Не удалось отправить заявку: в Firebase не опубликованы новые правила (permission-denied).':'Не удалось отправить заявку ('+(e.code||e.message)+').'}
  };
 }
 $('ab').onclick=async()=>{
  if(auth.currentUser){await U.signOut(auth);return}
  $('ab').disabled=true;bad=false;$('aus').textContent='Открываю вход через Google…';
  try{await U.signInWithPopup(auth,new U.GoogleAuthProvider())}
  catch(e){if(e.code!=='auth/cancelled-popup-request'){bad=true;$('aus').textContent=(MSG[e.code]||'Не удалось войти.')+' ('+(e.code||e.message)+')'}}
  $('ab').disabled=false;
 };
 U.onAuthStateChanged(auth,u=>{
  if(!u){$('ab').textContent='Войти через Google';$('chk').textContent='';$('rq').hidden=true;$('go').hidden=true;if(!bad)$('aus').textContent=HELP;return}
  $('ab').textContent='Выйти';
  $('aus').textContent='Вход выполнен: '+(u.email||'')+'.';
  $('chk').textContent='Проверяю доступ…';check(u);
 });
}catch(e){
 $('aus').textContent='Не удалось загрузить облако ('+(e&&e.message||e)+'). Отключи блокировщик рекламы для этого сайта или открой страницу в Chrome или Safari.';
 $('ab').disabled=false;$('ab').textContent='Обновить';$('ab').onclick=()=>location.reload();
}
</script>
</body>
</html>
